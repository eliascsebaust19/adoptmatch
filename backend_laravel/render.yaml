services:
  - type: web
    name: adoptmatch-api
    env: docker
    rootDir: backend_laravel
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: AdoptMatchAPI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://adoptmatch-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost,127.0.0.1
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
