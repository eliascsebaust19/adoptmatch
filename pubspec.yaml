name: adoptmatch
description: "Ethical pet adoption, foster management, and animal welfare platform."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.1.1
  cached_network_image: ^4.0.5
  qr_flutter: ^4.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  google_sign_in: ^6.2.2
  http: ^1.2.0
  url_launcher: ^6.3.3
  google_generative_ai: ^0.4.7
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_secure_storage_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
